<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RagaM-Roll</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <meta name="theme-color" content="#1a1a1a" />
  <!-- BEFORE THE FIRST PAINT, and before app.js — which is a module and therefore deferred.
       A reader who chose light and reloads must not be shown a dark page for the length of a
       module graph. Only an explicit choice is written here: 'system' leaves the attribute
       off, which is what hands the question back to the media query above. -->
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('ragamroll.theme');
        if (pref === 'light' || pref === 'dark') document.documentElement.dataset.theme = pref;
      } catch (_) { /* storage can be refused; the media query still answers */ }
    })();
  </script>
  <style>
    /* The same palette draw.html has always used, verbatim — warm paper-and-ink rather
       than grey-on-grey, and a light theme that follows the system. It lives here so the
       ROLL can read it: the roll is drawn on a canvas and cannot inherit anything, so
       until now it carried a hardcoded copy that matched neither draw nor the page it
       sat on. One palette, three surfaces. */
    :root{
      --bg:#15140f; --panel:#1e1c15; --panel2:#26231a; --ink:#ece7d9; --muted:#9a9280;
      --hair:rgba(236,231,217,.12); --hair2:rgba(236,231,217,.06);
      --amber:#d8a13f; --amberSoft:rgba(216,161,63,.55);
      --teal:#46c39a; --tealSoft:rgba(70,195,154,.9); --terra:#c96b5a;
      --serif:ui-serif,Georgia,"Iowan Old Style","Times New Roman",serif;
      --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    }
    /* THE LIGHT PALETTE, WRITTEN TWICE, and the two copies are one palette: change one and
       you must change the other. web/test/theme.test.js reads this file and fails if they
       drift, which is the only reason it is safe to have two.
       Why two: the theme follows the system UNTIL the reader says otherwise, and CSS cannot
       put a media rule and a plain selector in the same block. The media copy answers
       "system says light" and stands down the moment [data-theme] is set; the attribute copy
       answers "the reader chose light". Dark needs no copy at all — it is :root above. */
    @media (prefers-color-scheme:light){:root:not([data-theme]){
      --bg:#f4f0e6;--panel:#fbf8f0;--panel2:#f0ead9;--ink:#2a2418;--muted:#6f6752;
      --hair:rgba(42,36,24,.14);--hair2:rgba(42,36,24,.07);
      --amber:#a76f16;--amberSoft:rgba(167,111,22,.6);--teal:#177f5e;--tealSoft:rgba(23,127,94,.95);--terra:#b4553f;
    }}
    :root[data-theme="light"]{
      --bg:#f4f0e6;--panel:#fbf8f0;--panel2:#f0ead9;--ink:#2a2418;--muted:#6f6752;
      --hair:rgba(42,36,24,.14);--hair2:rgba(42,36,24,.07);
      --amber:#a76f16;--amberSoft:rgba(167,111,22,.6);--teal:#177f5e;--tealSoft:rgba(23,127,94,.95);--terra:#b4553f;
    }
    /* Draw's controls, verbatim. The app's buttons were square, variously sized and
       coloured one at a time; these are one rule for every button on the page, with the
       two states that mean something — `pri` for the action a bar is FOR, `on` for a
       mode that is armed. Everything below that only positions things. */
    button { font-family:var(--sans); font-size:.9rem; cursor:pointer; border-radius:8px;
      padding:.5rem .85rem; background:var(--panel2); color:var(--ink); border:1px solid var(--hair); }
    button:hover { border-color:var(--amberSoft); }
    button:disabled { opacity:.4; cursor:default; }
    button.pri { background:var(--teal); color:#08110d; border-color:var(--teal); font-weight:600; }
    button.on { background:var(--teal); color:#08110d; border-color:var(--teal); }
    input, select, textarea { font-family:var(--sans); }
    .tog { display:inline-flex; align-items:center; gap:.35rem; color:var(--muted); font-size:.82rem; }
    .tog select, .tog input { background:var(--panel2); color:var(--ink); border:1px solid var(--hair);
      border-radius:6px; padding:.12rem .3rem; font-size:.8rem; }
    .hint { color:var(--muted); font-size:.8rem; font-family:var(--mono); }

    * { box-sizing: border-box; }
    html, body { height:100%; }
    body { margin: 0; font-family: var(--sans); background:var(--bg); color:var(--ink); }
    /* SIZED FROM THE VISIBLE VIEWPORT, with the unit as the fallback.
       In fullscreen on a phone, dvh reported more than what was actually visible: the app
       came out taller than the screen, so the head bar — which holds the button that LEAVES
       fullscreen — sat off the top with a scroll needed to reach it. Android's own "drag from
       the top" only shows the status bar; it does not exit, and the thing that does was the
       thing pushed out of reach. --app-h is set from visualViewport.height, which is the one
       measurement that means what it says. */
    html, body { overflow:hidden; overscroll-behavior:none; }
    /* Clipped, so the chrome pushed past the bottom by the drawer's grip is GONE rather than
       making the page scroll. */
    #app { overflow:hidden; height:100vh; height:100dvh; height:var(--app-h, 100dvh);
      display:flex; flex-direction:column; overflow:hidden; }
    /* ONE ROW, always. The head holds a name, two links, a readout and fullscreen —
       nothing that needs a second line, and the readout wrapping to full width pushed
       the fullscreen button onto a row of its own. It shrinks and ellipses instead, so
       the button stays in the corner beside the badge at every width. */
    .toolbar { display:flex; gap:.5rem; align-items:center; padding:.5rem; border-bottom:1px solid var(--hair);
      flex-wrap:nowrap; }
    /* The open piece's name. Mono, because it is a filename. */
    .toolbar .readout { margin-left:auto; opacity:.8; font-size:.85rem; font-family:var(--mono);
      min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right; }
    .toolbar .readout.blank { opacity:.55; font-style:italic; }
    /* The theme switch, beside the badge: the page's own look, next to the page's own name. */
    .theme-btn { padding:.15rem .45rem; font-size:.9rem; line-height:1; }
    .toolbar .app-badge { font-weight:bold; font-size:.95rem; background:var(--panel2); border:1px solid var(--hair);
      border-radius:10px; padding:.12rem .55rem; margin-right:.25rem;
      /* Never breaks. On a narrow phone the name wrapped to two lines and took the whole
         head with it — the readout is the only thing here that may give ground. */
      white-space:nowrap; flex:0 0 auto; }
    .toolbar .help-link { display:inline-flex; align-items:center; justify-content:center; width:1.5rem; height:1.5rem;
      border-radius:50%; border:1px solid var(--hair); background:var(--panel2); color:var(--amber); text-decoration:none; font-weight:bold; font-size:.9rem; }
    .toolbar .help-link:hover { border-color:var(--amber); }
    /* Round, muted, the size of the help links beside it — the gamaka page's own icon
       button. On the right, where that page keeps it. */
    .toolbar .fs-btn { width:1.7rem; height:1.7rem; padding:0; border-radius:999px;
      color:var(--muted); font-weight:600; display:inline-flex; align-items:center;
      justify-content:center; font-size:.85rem; flex:0 0 auto; }
    .toolbar .fs-btn[aria-pressed=true] { color:var(--amber); border-color:var(--amberSoft); }
    /* THE CONTROLS' OWN SIZES. These were written for a .transport bar that no longer
       exists — the chrome became rows drawn from a layout, and every one of these rules
       quietly stopped matching anything. The range inputs went back to the browser's
       default 129px, which is why a row of four mixers took three lines on a phone.
       There is no container rule to restore: .chrome-row is the container. The blanket
       `button { padding:.3rem .6rem }` is deliberately NOT restored either — it would push
       the pinned row to two lines, and that is the one row that must never wrap. */
    .chrome-row .doc-btn { font-size:.82rem; padding:.28rem .6rem; }
    .chrome-row .doc-btn.ok { border-color:var(--teal); color:var(--teal); }
    .chrome-row .sapick { display:inline-flex; align-items:center; gap:.25rem; font-size:.85rem; }
    .chrome-row .sapick select { background:var(--panel2); color:var(--ink); border:1px solid var(--hair); border-radius:4px; padding:.1rem .25rem; font:inherit; }
    /* The roll's right-click menu. Fixed, because it is positioned in CLIENT coordinates
       from the pointer event — inside the scrolling roll it would slide away from the note
       it points at the moment anything scrolled. */
    .roll-ctx { position:fixed; z-index:50; background:var(--panel); border:1px solid var(--hair);
      border-radius:8px; padding:.25rem; box-shadow:0 8px 24px rgba(0,0,0,.35); min-width:140px; }
    .roll-ctx button { display:block; width:100%; text-align:left; border:0; background:none;
      color:var(--ink); padding:.4rem .55rem; border-radius:5px; font-size:.88rem; cursor:pointer; }
    .roll-ctx button:hover:not(:disabled) { background:var(--panel2); }
    .roll-ctx button:disabled { opacity:.4; cursor:default; }
    .chrome-row .tempo { display:inline-flex; align-items:center; gap:.3rem; font-size:.85rem; }
    .chrome-row .tempo .tempo-mult { width:4.5rem; accent-color:var(--teal); cursor:pointer; }
    .chrome-row .tempo .tempo-num { width:3.2rem; background:var(--panel2); color:var(--ink); border:1px solid var(--hair);
      border-radius:4px; padding:.1rem .25rem; font:inherit; }
    .chrome-row .tempo.on .tempo-num { border-color:var(--teal); color:var(--teal); }
    .chrome-row .tempo .tempo-reset { cursor:pointer; padding:.1rem .4rem; font-size:.85rem;
      border-radius:4px; padding:0 .3rem; font-size:.8rem; }
    .chrome-row .vol { display:inline-flex; align-items:center; gap:.25rem; font-size:.8rem;
      white-space:nowrap; opacity:.9; }
    .chrome-row .vol input[type=range] { width:5rem; cursor:pointer; accent-color:var(--teal); }
    /* An icon and nothing else, so it has to stay big enough for a thumb. The padding is
       what keeps it there: at .1rem it measured 32x27, which is under every guideline going,
       and a mixer you miss with your thumb mutes the wrong part. The row costs 4px for it. */
    .chrome-row .vol .vol-toggle { font-size:.95rem; padding:.28rem .45rem; line-height:1.15; }
    .chrome-row .vol .vol-toggle[aria-pressed=true] { border-color:var(--teal); }
    /* OFF, and it must read as off without a second glyph to compare it with. Dim alone is
       ambiguous on a phone in daylight; the line through it is not. */
    .chrome-row .vol .vol-toggle[aria-pressed=false] { opacity:.45; text-decoration:line-through; }
    .chrome-row .vol.muted input[type=range] { opacity:.4; accent-color:#777; }
    /* Unified Open ▾ menu */
    .openmenu { position:relative; display:inline-flex; }
    .openmenu-btn { cursor:pointer; }
    /* UPWARDS. The controls sit at the foot of the screen now, so a menu that drops from
       the button hangs off the bottom edge — which is where this one spent a release,
       with most of the examples unreachable. It opens above its button instead, and its
       own height is capped so a long list of examples scrolls INSIDE it rather than
       running past the top of the window. */
    /* Drops UP or DOWN, whichever has room, and scrolls rather than leaving the window. */
    .openmenu-pop.down { bottom:auto; top:100%; margin-bottom:0; margin-top:.3rem; }
    .openmenu-pop { overflow-y:auto; position:absolute; bottom:100%; left:0; margin-bottom:.3rem; z-index:900;
      background:var(--panel); border:1px solid var(--hair); border-radius:6px; min-width:11rem; padding:.25rem;
      display:flex; flex-direction:column; box-shadow:0 -8px 30px rgba(0,0,0,.5);
      max-height:min(70vh, 30rem); overflow-y:auto; overscroll-behavior:contain; }
    /* Said on the page, not in the console: over plain http a browser withholds AudioWorklet
       and the plucked voices make no sound at all. */
    .audio-warning { background:#fff3cd; color:#5c4400; border-bottom:1px solid #e0c97f;
      padding:8px 12px; font-size:14px; line-height:1.4; }
    /* The version doubles as the check-for-updates control, so it has to look pressable
       without becoming a button in a row of text. */
    /* NOT SELECTABLE, and not a long-press target. Tapping text inside an installed app on
       Android selects it and offers to search the web for it — which is what tapping the
       version did before it was a button, and would still do to a button made of text. */
    .ver-btn { font:inherit; color:inherit; background:none; border:none; padding:2px 0;
      text-decoration:underline dotted; text-underline-offset:2px; cursor:pointer;
      user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
      touch-action:manipulation; }
    .upd { font:inherit; margin-left:.5rem; padding:1px 8px; border-radius:10px; cursor:pointer;
      background:#1f6f3f; color:#fff; border:1px solid #14522d; }
    .upd-none { margin-left:.5rem; opacity:.7; }
    .openmenu-item { display:block; width:100%; text-align:left; background:none; border:0; color:var(--ink);
      padding:.35rem .5rem; border-radius:4px; cursor:pointer; font:inherit; }
    .openmenu-item:hover { background:var(--panel2); }
    .openmenu-item.current { color:var(--amber); }
    .openmenu-sep { opacity:.5; font-size:.72rem; letter-spacing:.05em; text-transform:uppercase; padding:.35rem .5rem .15rem; }
    .openmenu-link { display:flex; gap:.3rem; padding:.1rem .5rem .2rem; }
    .openmenu-linkin { flex:1 1 0; min-width:8rem; background:var(--panel2); color:var(--ink); border:1px solid var(--hair);
      border-radius:4px; padding:.25rem .4rem; font:inherit; font-size:.82rem; }
    .openmenu-linkin.err { border-color:#c55; }
    .openmenu-linkgo { background:var(--panel2); color:var(--amber); border:1px solid #556; border-radius:4px;
      padding:.25rem .55rem; cursor:pointer; font:inherit; font-size:.82rem; }
    .openmenu-linkerr { color:#e88; font-size:.75rem; padding:0 .5rem .2rem; }
    .diagnostics { margin:.5rem; padding:.5rem; border:1px solid #a63; border-radius:4px; background:#241a10; color:#eda; font-size:.85rem; max-height:20vh; overflow:auto; }
    .diagnostics ul { margin:.25rem 0 0; padding-left:1.25rem; }
    .dialog-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.6);
      display:flex; align-items:flex-start; justify-content:center; padding:4vh 1rem; z-index:1000; }
    .dialog-box { background:var(--panel); border:1px solid var(--hair); border-radius:6px;
      width:min(760px,100%); max-height:88vh; display:flex; flex-direction:column;
      box-shadow:0 8px 40px rgba(0,0,0,.6); }
    .dialog-head { display:flex; justify-content:space-between; align-items:center;
      padding:.6rem .8rem; border-bottom:1px solid var(--hair); }
    .dialog-head button { cursor:pointer; background:var(--hair); color:var(--ink); border:1px solid var(--hair); border-radius:4px; }
    .dialog-body { position:relative; overflow:hidden; padding:.5rem .8rem; display:flex; flex-direction:column; min-height:0; }
    /* Sticky control strip: stays put while the raga list scrolls beneath it.
       Negative margins + matching padding let its background cover the
       dialog-body padding so scrolled rows never peek above it. Room here for
       more filter controls later. */
    .ref-controls { position:sticky; top:0; z-index:2; background:var(--panel);
      margin:-.5rem -.8rem .35rem; padding:.5rem .8rem .1rem; }
    .dialog-search { width:100%; padding:.35rem .5rem; margin-bottom:.4rem;
      background:var(--panel2); color:var(--ink); border:1px solid var(--hair); border-radius:4px; }
    .dialog-count { opacity:.6; font-size:.8rem; margin-bottom:.3rem; }
    .ref-list { list-style:none; margin:0; padding:0; font-family:ui-monospace,monospace; font-size:13px; }
    .ref-list li { display:grid; grid-template-columns:10rem 1fr; column-gap:.8rem;
      padding:.3rem 0; border-bottom:1px solid var(--panel2); align-items:baseline; }
    .ref-cols { display:flex; flex-direction:column; gap:.1rem; overflow-x:auto; }
    .ref-name { font-weight:bold; }
    .ref-seq { color:var(--amber); }
    .ref-map { color:var(--muted); }
    .ref-int { color:#cc9; }
    /* Scale ⚙ / Drone toggles */
    .toolbar .scale-btn.active { border-color:var(--teal); color:var(--teal); }
    .toolbar .timbre { display:inline-flex; align-items:center; gap:.25rem; font-size:.9rem; }
    .toolbar .timbre select { background:var(--panel2); color:var(--ink); border:1px solid var(--hair); border-radius:4px;
      padding:.15rem .3rem; font:inherit; cursor:pointer; }
    /* Experimental 53-EDO scale dialog */
    .scale-box { width:min(680px,96vw); }
    .mela-row label { font-size:.9rem; }
    .mela-row select { margin-left:.35rem; background:var(--panel2); color:var(--ink); border:1px solid var(--hair);
      border-radius:4px; padding:.2rem .35rem; font:inherit; }
    /* Mela picker + a/b table */
    .mela-row { display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; margin:.2rem 0 .6rem; }
    .mela-row .mela-step { cursor:pointer; background:var(--panel2); color:var(--ink); border:1px solid var(--hair);
      border-radius:4px; padding:.15rem .45rem; font:inherit; }
    .mela-row .mela-step:disabled { opacity:.35; cursor:default; }
    .mela-row .mela-chakra { font-size:.78rem; opacity:.6; margin-left:.2rem; }
    .mela-table { border-collapse:collapse; width:100%; font-family:ui-monospace,monospace; margin:.2rem 0 .7rem; }
    .mela-table th { text-align:right; font-weight:normal; opacity:.55; font-size:.72rem; padding:.2rem .5rem .2rem 0; }
    .mela-table td { text-align:center; padding:.2rem .3rem; font-size:.85rem; }
    .mela-table .mt-swara td { font-weight:bold; }
    .mela-table .mt-variety td { color:var(--teal); }
    .mela-table .mt-edo td, .mela-table .mt-cents td { opacity:.7; font-size:.78rem; }
    .mela-table .fixed-dot { opacity:.4; }
    .mela-table .ab { display:inline-flex; gap:2px; }
    .mela-table .ab-btn { cursor:pointer; background:var(--panel); color:#bbb; border:1px solid var(--hair);
      border-radius:3px; width:1.4rem; padding:.1rem 0; font:inherit; font-size:.78rem; }
    .mela-table .ab-btn.on { background:#183028; border-color:var(--teal); color:var(--teal); }
    .scale-actions { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; padding-top:.3rem; border-top:1px solid var(--hair); }
    .scale-actions .actions-spacer { flex:1 1 auto; }
    .scale-actions .reset-icon { font-size:1rem; padding:.15rem .5rem; }
    .scale-actions .suggest-btn { background:#1c2f3a; border-color:#69c; color:var(--amber); }
    /* Tala browser */
    .tala-box { width:min(680px,96vw); }
    .tala-hint { font-size:.8rem; opacity:.75; margin:.1rem 0 .4rem; }
    .tala-timbre { display:inline-flex; align-items:center; gap:.3rem; font-size:.82rem;
      margin:0 0 .6rem; color:#ccc; }
    .tala-timbre select { font-size:.82rem; }
    .tala-list { list-style:none; margin:0; padding:0; }
    .tala-list li { padding:.45rem 0; border-bottom:1px solid var(--panel2); }
    .tala-head { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }
    .tala-play { cursor:pointer; background:var(--panel2); color:var(--ink); border:1px solid var(--hair); border-radius:4px;
      padding:.1rem .55rem; font-size:.9rem; }
    .tala-play.on { border-color:var(--teal); color:var(--teal); }
    .tala-name { font-weight:bold; }
    .tala-count { font-size:.74rem; opacity:.6; }
    /* One row always: boxes shrink to fit (14 aksharas on a phone) rather than
       wrapping; aspect-ratio keeps them square, max-width stops few-akshara rows
       from ballooning. */
    .akrow { display:flex; flex-wrap:nowrap; gap:3px; margin:.35rem 0 .1rem; }
    .akbox { flex:1 1 0; min-width:0; max-width:1.5rem; aspect-ratio:1; display:flex; align-items:center;
      justify-content:center; border:1px solid #5a5a5a; border-radius:4px; background:#1c1c1c;
      font-family:ui-monospace,monospace; font-size:.7rem; }
    .akbox.start { border-color:var(--teal); color:var(--teal); background:var(--panel2); }
    .akbox.acc { border-color:var(--muted); color:#eca; background:#211a12; }
    .akbox.on { background:#2b4; color:var(--panel2); border-color:#2b4; }
    /* Raga browser preview */
    .raga-list li { display:grid; grid-template-columns:auto 1fr; column-gap:.6rem; align-items:start;
      padding:.35rem 0; border-bottom:1px solid var(--panel2); }
    .raga-list li.playing { background:var(--panel2); }
    .raga-play { cursor:pointer; background:var(--panel2); color:var(--ink); border:1px solid var(--hair); border-radius:4px;
      padding:.1rem .5rem; font-size:.85rem; align-self:center; }
    .raga-play.on { border-color:var(--teal); color:var(--teal); }
    .raga-main .ref-name { font-weight:bold; }
    .raga-list .ref-mela { color:#c9c; font-size:.78rem; }
    .raga-list .ref-aroha { color:var(--muted); font-size:.78rem; font-family:ui-monospace,monospace; }
    /* Raga browser v2: 22-shruti grid header + per-row X footprint, sharing one
       column template so swaras line up under their shrutis. */
    /* ---- the raga browser: a card per raga, a row per recording ---- */
    /* The switchboard diagram, drawn by core/raga-switchboard.js. Its classes carry no
       colours of their own, so it is painted here in the app's own palette — the wires
       teal like everything else that means "this is the music". */
    .rg-kbd { margin:.3rem 0 .1rem; }
    .rg-kbd .kbd { display:block; width:100%; max-width:420px; height:auto; overflow:visible; }
    .rg-kbd .kbd .k { fill:var(--panel2); stroke:var(--hair); stroke-width:.6; }
    .rg-kbd .kbd .k.bk { fill:#3c3c44; }
    .rg-kbd .kbd .kl { font:600 10px var(--mono); fill:var(--ink); text-anchor:middle; dominant-baseline:central; }
    .rg-kbd .kbd .kl.onbk { fill:#f0f0f2; }
    .rg-kbd .kbd .wire path { fill:none; stroke:var(--teal); stroke-width:1.6; stroke-linecap:round; }
    /* The post is not a wire: nothing travels along it, it is the key's own stem holding
       the points wires plug into. Dashed and grey, so it is never read as a phrase. */
    .rg-kbd .kbd .wire path.post { stroke:var(--muted); stroke-width:.9; stroke-dasharray:2 2; opacity:.7; }
    .rg-kbd .kbd .wire circle.anchor { fill:var(--panel); stroke:var(--muted); stroke-width:1.1; }
    .rg-kbd .kbd .wire path.ah { fill:var(--teal); stroke:none; }   /* outranks the wire's fill:none */
    .rg-scroll { overflow:auto; flex:1 1 auto; min-height:0; padding:.25rem .1rem .5rem; }
    .rg-nocorpus { margin:.4rem .1rem; padding:.5rem .6rem; border:1px solid var(--hair); border-radius:8px;
      color:var(--muted); font-size:.82rem; }
    .rg-nocorpus code { background:var(--panel2); padding:.05em .35em; border-radius:4px; }
    .rg-card { border:1px solid var(--hair); border-radius:10px; padding:.5rem .6rem; margin:.4rem .1rem; }
    .rg-card.cur { border-color:var(--amberSoft); }

    .rg-sheet { flex:0 0 auto; display:flex; flex-direction:column; height:min(46vh, 340px);

    .rg-sheethd { display:flex; align-items:center; gap:.5rem; padding:.4rem .6rem; flex:0 0 auto;

    .raga2-box { width:min(96vw, 760px); max-width:96vw; --rr-gutter:11rem; }

    .rr-comma.anchor { color:#bcbcbc; border:1px solid #6a6a6a; border-radius:3px; min-height:1rem;

    button.rr-comma { cursor:pointer; background:#1e1e1e; color:#c9a; border:1px solid var(--hair);
      border-radius:3px; padding:0; line-height:1; min-height:1rem; }

    .rr-aroha, .rr-avaroha { color:var(--muted); font-size:.68rem; font-family:ui-monospace,monospace;

    /* Mobile portrait: shrink the name gutter + glyphs so all 22 shruti columns
       fit without horizontal scroll. */
    @media (max-width:560px) {

    .scale-actions button { cursor:pointer; background:var(--panel2); color:var(--ink); border:1px solid var(--hair);
      border-radius:4px; padding:.3rem .7rem; }
    .scale-actions button.primary { background:#1c3a30; border-color:var(--teal); color:var(--teal); }
    .scale-actions button:disabled { opacity:.4; cursor:default; }
    .workspace { flex:1 1 0; min-height:0; display:flex; flex-direction:column; padding:.35rem .5rem; }
    .cols { display:grid; gap:.3rem; align-items:stretch; min-height:0; min-width:0; }  /* tracks set inline; rows when stacked */
    .cols > * { min-width:0; min-height:0; }
    /* Stacked: the same three children in one column, which is the gamaka page's
       portrait shape — the roll across the full width and the notation under it. */
    .cols.stacked > .editor-pane, .cols.stacked > .pane { height:auto; }
    .editor, .pane {
      font-family: ui-monospace, "Menlo", "Consolas", monospace;
      font-size: 15px; line-height: 1.2; white-space: pre; overflow:auto;
      background:var(--panel2); color:var(--ink); border:1px solid var(--hair); border-radius:4px;
      padding:.5rem; margin:0;
    }
    /* The card the roll sits on is the LIGHT surface, as it is on the gamaka page: that
       page's .stage is --panel and the app's pane was --panel2, the darkest of the three,
       which is the whole of why one looked dimmer than the other side by side. The
       notation box stays --panel2 there too — a well is meant to read as sunk. */
    .pane.roll { background:var(--panel); border-radius:13px; }
    .cols > .editor, .cols > .pane, .cols > .editor-pane { height:100%; min-height:0; }
    /* The notation box and its pickers are one pane, the way they are on the gamaka
       page: which raga you are in belongs beside the swaras, not two bars away. */
    .editor-pane { display:flex; flex-direction:column; gap:.35rem; min-height:0; }
    .editor-pane .editor { flex:1 1 auto; min-height:0; }
    .edittools { flex:0 0 auto; display:flex; flex-wrap:wrap; gap:.5rem; align-items:center;
      color:var(--muted); font-size:.8rem; }
    .edittools input, .edittools select { background:var(--panel2); color:var(--ink);
      border:1px solid var(--hair); border-radius:6px; padding:.15rem .35rem; font-size:.82rem; }
    .edittools input:disabled, .edittools select:disabled { opacity:.45; }
    .editor { width:100%; }
    .pane.notation { margin:.35rem 0 0; min-height:0; }  /* flex share set inline */
    /* All the controls at the bottom, where a thumb is — the gamaka page's shape. The
       head above keeps only what the page IS and what the piece is. */
    .controlbar { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap;
      padding:.4rem .5rem; border-top:1px solid var(--hair); flex:0 0 auto; }
    .controlbar .timbre { display:inline-flex; align-items:center; gap:.3rem; }
    /* A–B and its reset used to live in the roll's tool strip; they are the chip at the
       head of the margin now, drawn on the canvas beside the swara names. */
    /* The notation on a drawer: a grip, and a body whose height IS the drag. Shut is
       height 0 and overflow hidden, so the textarea stays in the document. */
    .editor-drawer { flex:0 0 auto; display:flex; flex-direction:column; padding:0 .5rem; }
    .editor-drawer .grip { flex:0 0 auto; height:16px; display:flex; align-items:center;
      justify-content:center; cursor:ns-resize; touch-action:none; }
    .editor-drawer .grip span { width:44px; height:4px; border-radius:2px; background:var(--hair); }
    .editor-drawer .grip:hover span { background:var(--amberSoft); }
    .editor-drawer .drawer-body { overflow:hidden; display:flex; flex-direction:column; gap:.35rem; }
    .editor-drawer.open .drawer-body { padding-bottom:.35rem; }
    .editor-drawer .editor { flex:1 1 auto; min-height:0; }
    .split-v { width:6px; background:var(--hair); cursor:col-resize; border-radius:3px; touch-action:none;
      position:relative; }
    /* The swap button rides on the divider it operates. Overflowing the 6px bar is the
       point — it has to be big enough to press. */
    .split-v .swap-btn { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      width:1.55rem; height:1.55rem; padding:0; border-radius:50%; font-size:.8rem;
      display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:2; }
    .split-h { height:6px; margin:.15rem .5rem; background:var(--hair); cursor:row-resize; border-radius:3px; touch-action:none; }
    .split-v:hover, .split-h:hover { background:#66c; }
    /* The roll is a canvas now, so the pane holds no text and does its own scrolling:
       the inner holder is the scroll window, and the canvas inside it stays
       viewport-sized however long the piece is. */
    /* Column, so the roll's own controls sit ABOVE its canvas rather than beside it —
       they act on what the roll has selected, so they belong to the roll, not to the
       app-wide toolbar. min-height:0 or the holder refuses to shrink and the strip is
       pushed off the pane. */
    .pane.roll { white-space:normal; overflow:hidden; padding:0; display:flex; flex-direction:column; }
    /* NEVER reflows. This strip sits above the canvas, so if its height changes the
       canvas moves — and a hint that wraps to two lines when the text gets longer moved
       it 14px between a pointerdown and the click that followed, landing the click on a
       different part of the roll. One line, clipped, no wrapping. */
    .roll-tools { display:flex; gap:.5rem; align-items:center; padding:.25rem .4rem;
      border-bottom:1px solid var(--hair); background:var(--panel); font-size:.75rem; flex:0 0 auto;
      flex-wrap:nowrap; white-space:nowrap; overflow:hidden;
      /* Fixed, not intrinsic: roll mode and the curve editor carry different controls,
         and letting the strip size to them changed its height by 7px when you opened a
         note — moving the canvas for that reason alone. */
      height:2.4rem; box-sizing:border-box; }
    .roll-tools > * { flex:0 0 auto; }
    .roll-tools button { font-size:.75rem; padding:.2rem .55rem; border-radius:6px; }
    .roll-tools .rt-what { opacity:.6; flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
    .roll-tools .rt-hz { font-family:var(--mono); color:var(--teal); min-width:6.5em; }
    .roll-tools .rt-snap { display:flex; gap:.25rem; align-items:center; opacity:.85; }
    /* On a phone the strip has to hold seven controls across ~340px, so the padding
       goes before anything gets clipped. */
    @media (max-width:430px) {
      .roll-tools { gap:.3rem; padding:.25rem .25rem; }
      .roll-tools button { padding:.2rem .4rem; }
      .roll-tools .rt-gmove select { padding:.05rem .1rem; }
    }
    .roll-tools .rt-gmove { gap:.25rem; }
    .roll-tools .rt-gmove select { font-size:.72rem; padding:.05rem .2rem; }
    .roll-tools .rt-zoom { display:flex; gap:.25rem; align-items:center; }
    .roll-tools .rt-zoom b { font-weight:600; min-width:2.2em; text-align:center; opacity:.8; }
    /* The roll's body: the scroll window, with the time-zoom slider down its right edge.
       The pitch-zoom slider sits under both, along the bottom of the pane. */
    .roll-body { flex:1 1 auto; min-height:0; display:flex; align-items:stretch; }
    .roll-holder { flex:1 1 auto; min-width:0; min-height:0; overflow-y:auto; overflow-x:hidden; }
    /* The lane rail: what is sung, against the notes it is sung on. It does NOT scroll —
       it holds one tall inner div translated by the roll's own scrollTop, so the two axes
       cannot drift and there is no second scrollbar to reconcile. */
    .lanes-rail { flex:0 0 auto; width:5.6rem; min-width:0; overflow:hidden; position:relative;
      background:var(--panel2); border-radius:4px; }
    .lanes-rail.left { margin-right:.25rem; } .lanes-rail.right { margin-left:.25rem; }
    .lanes-clip { position:absolute; left:0; right:0; bottom:0; overflow:hidden; }
    .lanes-inner { position:absolute; left:0; right:0; will-change:transform; }
    /* The rail's own controls, in the band where the roll writes its pitch names — beside
       what they act on, and over nothing, since the groups are clipped out of that band
       exactly as the canvas clips its notes. */
    .lanes-head { position:absolute; left:0; right:0; top:0; z-index:4; display:flex;
      align-items:center; justify-content:center; gap:2px; }
    .lanes-head button { padding:3px 7px; font-size:14px; line-height:1.1; border-radius:4px;
      background:var(--panel); color:var(--muted); border:1px solid var(--hair); cursor:pointer; }
    .lanes-head button:hover { color:var(--ink); border-color:var(--amberSoft); }
    /* The app's own palette, at low alpha over the panel: the lane editor's greens and
       browns are its dark page's, and pasted in here they are two colours from another
       room. Teal for what is written, terracotta for what is sung — the same two the roll
       already uses for a curve and a warning, so the page keeps its vocabulary. */
    /* Text at the TOP of its cell, not the middle. Time runs downward here, so the top of
       a cell is the instant the note begins — and that is where the syllable begins too:
       the consonant is struck at the onset and it is the VOWEL that stretches through the
       rest of the cell. Centred, a long note put its syllable half a beat late, which is
       exactly the wrong place for the one part of it a singer has to arrive at on time.
       (The lane editor runs time left to right, where its text already starts at the
       leading edge — the same claim, in that orientation.) */
    .lane-box { position:absolute; border-radius:3px; overflow:hidden; padding:1px 3px 0;
      display:flex; align-items:flex-start; font:11px/1.05 var(--mono); color:var(--ink);
      border:1px solid var(--hair); }
    .lane-box.w { left:2px; width:calc(50% - 3px); background:color-mix(in srgb, var(--teal) 22%, var(--panel)); }
    .lane-box.s { left:50%; width:calc(50% - 3px); background:color-mix(in srgb, var(--terra) 22%, var(--panel)); }
    /* Swapped: the syllables lead. Which one a reader wants on the inside — nearest the
       notes — depends on which they are following, and both answers are ordinary. */
    .lanes-rail.swapped .lane-box.w { left:50%; }
    .lanes-rail.swapped .lane-box.s { left:2px; }
    .lane-box span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    /* The same line the roll draws across its own plot, continued across the rail: what is
       being sung at this instant is the group it is crossing. Teal and 2px, because it is
       that line and not another one. */
    .lane-head { position:absolute; left:0; right:0; top:0; height:2px; background:var(--teal);
      opacity:.95; pointer-events:none; z-index:3; }
    .roll-zt { flex:0 0 auto; width:1.4rem; margin:.2rem .1rem; writing-mode:vertical-lr; direction:rtl;
      accent-color:var(--teal); cursor:pointer; touch-action:none; }
    /* Reversed: dragging RIGHT narrows the range, which is zooming IN — the direction a
       reader expects a zoom control to travel. */
    /* The pitch scrollbar: the time axis has the browser's, and this axis is a mapping
       onto the canvas width with nothing overflowing for one to appear on. Sits between
       the roll and the zoom slider, in the reading order the two have — where you are,
       then how close. */
    /* Where a note came from: a strip above the notation, not a tooltip. A tooltip would
       sit over the roll covering the notes being compared against, and could not hold a
       long fragment. */
    .gka-strip { flex:0 0 auto; display:flex; align-items:center; gap:.5rem;
      padding:.15rem .4rem; border-bottom:1px solid var(--hair); font-size:.8rem; }
    .gka-strip .gka-toggle { display:inline-flex; align-items:center; gap:.25rem;
      color:var(--muted); white-space:nowrap; cursor:pointer; }
    .gka-strip.on .gka-toggle { color:var(--ink); }
    /* One line, scrolling sideways: a source fragment can be long, and a strip that grew
       to fit it would push the notation down every time the pointer moved. */
    .gka-value { flex:1 1 auto; min-width:0; overflow-x:auto; overflow-y:hidden;
      white-space:nowrap; padding:.1rem 0; }
    .gka-value code { font-family:var(--mono); color:var(--teal); }
    .gka-hint { color:var(--muted); opacity:.7; font-style:italic; }
    /* Reading mode: the notation with every {…} folded to a mark. Same box, same type, so
       switching between writing and reading does not move the text about. */
    .editor.reading { margin:0; overflow:auto; background:var(--panel2); color:var(--ink);
      border:1px solid var(--hair); border-radius:6px; padding:.5rem;
      font-family:var(--mono); font-size:.9rem; line-height:1.6; cursor:default; }
    /* Swaras flow to fill the width; a directive, a comment or a blank line keeps its own,
       because each of them says something about the lines that follow it. */
    /* Each group is a paragraph: the swaras of one avartana (or of as many as it took to
       close on one), wrapping inside it, with air between groups so the cycles are countable
       down the page. */
    .editor.reading .ln { white-space:pre-wrap; }
    .editor.reading .ln.notes { display:block; margin:0 0 .55rem; }
    .editor.reading .ln.notes.ragged { border-left:2px solid var(--hair); padding-left:.4rem;
      margin-left:-.6rem; }
    .editor.reading .ln.directive, .editor.reading .ln.comment { display:block; }
    .editor.reading .ln.directive { color:var(--amber); }
    .editor.reading .ln.comment { color:var(--muted); font-style:italic; }
    .editor.reading .ln.blank { display:block; height:.5rem; }
    .editor.reading .fold { color:var(--muted); opacity:.75; padding:0 .1rem; cursor:help; }
    .editor.reading .fold.curve { color:var(--teal); opacity:.9; }
    .editor.reading .fold:hover { opacity:1; background:var(--panel); border-radius:3px; }
    /* The piece's length, beside its name. Monospace so it does not jitter as it counts,
       and quiet: it is a fact about the piece, not a control. */
    /* Into the editor, from the raga browser. Quiet — it is the way out of the dialog, not
       the reason you opened it. */
    .rg-sheethd .rg-edit { color:var(--amber); }
    /* The instrument panel. A column of sliders with the name a player would use on the
       left and the value as they would say it on the right. */
    .instr-btn { padding:.15rem .4rem; }
    .instr-box { max-width:min(520px, 94vw); }
    .instr-body { display:flex; flex-direction:column; gap:.15rem; }
    .instr-presets { display:flex; gap:.3rem; flex-wrap:wrap; margin:.1rem 0 .5rem; }
    .instr-presets button { font-size:.8rem; padding:.15rem .5rem; }
    .instr-hint { margin:.1rem 0 .5rem; color:var(--muted); font-size:.82rem; line-height:1.45; }
    .instr-foot { margin-top:.6rem; }
    /* The file input is the button's plumbing, not a control: ⭱ Load clicks it. */
    .instr-file { display:none; }
    /* The layout panel shows the rows it is about to save: a tag for where the row sits and
       the controls on it, wrapping, so the shape on screen is the shape in the file. */
    .layout-box { max-width:min(520px, 94vw); }
    .layout-row { display:flex; align-items:baseline; gap:.4rem; margin:.15rem 0; }
    .layout-tag { flex:0 0 3.2rem; text-align:right; color:var(--muted); font-size:.78rem; }
    .layout-ids { display:flex; flex-wrap:wrap; gap:.25rem; }
    .layout-ids code { background:var(--hair2); border-radius:3px; padding:.05rem .3rem; font-size:.8rem; }
    .layout-btn.active { border-color:var(--teal); color:var(--teal); }
    /* A settings row: the box, the name, and what turning it off actually does — the last of
       which is the part worth reading, so it wraps under rather than being cut short. */
    .set-row { display:grid; grid-template-columns:auto 5rem 1fr; gap:.4rem; align-items:baseline;
      margin:.5rem 0; cursor:pointer; }
    .set-row .set-name { font-weight:600; }
    .set-range { width:5.5rem; }
    .set-row code { background:var(--hair2); border-radius:3px; padding:.05rem .25rem; }
    .instr-foot code { background:var(--hair2); border-radius:3px; padding:.05rem .3rem; margin-right:.2rem; }
    /* The chrome, drawn a row at a time from the layout. Row 1 is pinned under the roll. */
    /* Tight on purpose. The pinned row came to 379px of controls in a 395px phone — over by
       a hair, and a hair is a whole second line. */
    .chrome-row { display:flex; flex-wrap:wrap; align-items:center; gap:.22rem;
      padding:.15rem .25rem; }
    .chrome-row .timbre select { max-width:5.2rem; }
    .chrome-pinned { border-bottom:1px solid var(--hair2); }
    /* Everything below the roll: the notation drawer, the transport, the controls, the
       footer. It slides down as one when the grip is pushed past shut. */
    /* The controls' home when the panes are side by side: a block at the foot of the
       notation column, tight rows with the pane's gap around the group rather than between
       every row. flex:0 0 auto so the notation box is what gives way, never the buttons. */
    .chrome-col { flex:0 0 auto; display:flex; flex-direction:column; }
    .below { display:contents; }
    .below[style] { display:block; flex:0 0 auto; }
    /* The A/V trim: two nudges and a reading that is only there once it means something. */
    .sync { display:inline-flex; align-items:center; gap:.1rem; }
    .sync .sync-nudge { padding:.15rem .35rem; font-size:.8rem; }
    /* A FIXED width. The reading grows from "sync" to "-140 ms" as it is nudged, and a row
       that reflows while a button is held moves that button out from under the finger — which
       on a phone means the hold silently stops, or lands on its neighbour. */
    .sync .sync-name { padding:.15rem .4rem; font-size:.78rem; color:var(--muted);
      background:none; border-color:transparent; font-family:var(--mono);
      width:4.4rem; text-align:center; }
    .sync.on .sync-name { color:var(--amber); border-color:var(--amberSoft); }
    /* A newer build exists but this device is still being handed the old one — a wait, not a
       fault, and not the same thing as being current. */
    .upd-waiting { color:var(--amber); }
    .upd-offline { color:var(--muted); }
    /* The timing report. The summary line is the whole thing — big, monospaced and easy to
       select on a phone, because retyping it is the fallback that always works. */
    .perf-box { max-width:min(560px, 94vw); }
    .perf-body { display:flex; flex-direction:column; gap:.2rem; }
    .perf-line { font-family:var(--mono); font-size:.86rem; line-height:1.5; margin:.2rem 0 .4rem;
      padding:.45rem .55rem; background:var(--panel2); border:1px solid var(--hair); border-radius:5px;
      color:var(--ink); word-break:break-word; user-select:all; cursor:text; }
    .perf-acts { display:flex; gap:.4rem; align-items:center; margin-bottom:.3rem; }
    .perf-said { font-size:.8rem; color:var(--teal); }
    .perf-table { width:100%; border-collapse:collapse; font-size:.82rem; }
    .perf-table th { text-align:left; font-weight:600; color:var(--muted); padding:.22rem .5rem .22rem 0;
      white-space:nowrap; vertical-align:top; }
    .perf-table td { padding:.22rem 0; vertical-align:top; }
    .perf-table td:first-of-type { font-family:var(--mono); color:var(--ink); white-space:nowrap; padding-right:.6rem; }
    .perf-note { color:var(--muted); font-size:.76rem; line-height:1.35; }
    .perf-hist { font-family:var(--mono); font-size:.72rem; margin-top:.5rem; }
    /* A long press must not select the version text under the finger. */
    .ver, .ver-btn { user-select:none; -webkit-user-select:none; touch-action:manipulation; }
    .instr-msg { color:var(--ink); }
    .instr-bad { color:var(--terra); }
    .instr-row { display:grid; grid-template-columns:7.5rem 1fr 4.2rem; align-items:center;
      gap:.5rem; padding:.12rem 0; cursor:pointer; }
    .instr-row:hover { background:var(--panel2); border-radius:4px; }
    .instr-name { font-size:.86rem; color:var(--ink); }
    .instr-row input[type=range] { width:100%; accent-color:var(--amber); }
    .instr-val { font-family:var(--mono); font-size:.78rem; color:var(--muted); text-align:right; }
    .toolbar .head-dur { font-family:var(--mono); font-size:.8rem; color:var(--muted);
      margin-left:.4rem; white-space:nowrap; }
    .roll-hs { flex:0 0 auto; height:.55rem; margin:.15rem .5rem 0 2.6rem; position:relative;
      background:var(--panel2); border-radius:.3rem; cursor:pointer; touch-action:none; }
    .roll-hs-thumb { position:absolute; top:0; bottom:0; background:var(--amberSoft);
      border-radius:.3rem; min-width:1.2rem; }
    .roll-hs:hover .roll-hs-thumb { background:var(--amber); }
    .roll-zp { flex:0 0 auto; height:1.2rem; margin:.1rem .5rem .2rem 2.6rem; direction:rtl;
      accent-color:var(--teal); cursor:pointer; touch-action:none; }
    .roll-holder > div { position:relative; width:100%; }
    /* The margin strip — see RollPane. Transparent, above the canvas, and the one place
       on the roll where a touch may not start a scroll. */
    .roll-gutter { position:absolute; top:0; left:0; height:100%; width:0; z-index:3; touch-action:none; }
    /* No OS text-callout on a long press: that gesture is the roll's own menu now, and
       iOS would otherwise offer to select or copy a canvas nobody can select. */
    .roll-holder canvas { display:block; position:sticky; top:0; width:100%;
      -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
    .footer { display:flex; gap:.6rem; align-items:center; padding:.35rem .6rem; border-top:1px solid var(--hair); font-size:.75rem; opacity:.7; }
    .footer .build { margin-left:auto; }  /* build timestamp + version, pushed right */
    .footer .ver { color:var(--amber); font-family:ui-monospace,monospace; }
    /* Mobile portrait. The head needs nothing here any more — it holds no controls
       since they moved to the bottom, and it is a single non-wrapping row at every
       width. */
    @media (max-width:560px) {
      /* Portrait: the sliders give up a little more width. Nothing right-pins a group any
         more — the rows do that, and each is as wide as the window. */
      .chrome-row .vol input[type=range] { width:4.2rem; }
      .chrome-row .tempo .tempo-mult { width:3.2rem; }
      /* Three digits and no more: the box takes 20-600. Overridden, the ↺ appears beside it,
         and without this the row lands 3px over the window and takes a second line for them. */
      .chrome-row .tempo .tempo-num { width:2.8rem; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./app.js"></script>
  <!-- The worker is registered by core/app-update.js, which the footer uses to watch for a
       newer build and offer the reload that enters it. Registering here as well would race
       it for the same registration. -->
  <script type="module">
    // The height the app is allowed to be, in pixels, from the viewport that is actually
    // visible — and re-asked whenever that changes: entering or leaving fullscreen, the
    // address bar sliding away, the keyboard arriving, a rotation.
    // WRITTEN ONLY WHEN IT CHANGES, and never more than once a frame. Setting a custom
    // property on the root invalidates style and layout for everything that reads it, which
    // is the whole app — and on a phone visualViewport fires as the address bar slides and
    // as the page rubber-bands, so the first version of this did that layout on every one of
    // them. It starved the note scheduler, and a fresh play crackled from its first second.
    // Desktop never showed it: there, those events barely fire.
    //
    // The SCROLL listener is gone entirely. Scrolling does not change the height; it was
    // belt-and-braces, and it was the one firing constantly.
    const vv = window.visualViewport;
    let applied = -1, queued = false;
    const write = () => {
      queued = false;
      const h = Math.round((vv && vv.height) || window.innerHeight);
      if (h === applied) return;          // nothing to invalidate
      applied = h;
      document.documentElement.style.setProperty('--app-h', h + 'px');
    };
    const fit = () => { if (queued) return; queued = true; requestAnimationFrame(write); };
    write();
    addEventListener('resize', fit);
    addEventListener('orientationchange', fit);
    if (vv) vv.addEventListener('resize', fit);
    // Entering fullscreen can leave the page scrolled down, which is how the head bar went
    // missing. The size is re-taken a beat later as well: the window is not always its final
    // size at the moment the event fires.
    for (const ev of ['fullscreenchange', 'webkitfullscreenchange']) {
      addEventListener(ev, () => { fit(); scrollTo(0, 0); setTimeout(() => { fit(); scrollTo(0, 0); }, 250); });
    }
  </script>
</body>
</html>
