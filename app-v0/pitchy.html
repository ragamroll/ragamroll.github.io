    }
    // In a shared session, Choose File loads the audio for playback AND — if it is
    // the shared SOURCE — upgrades the coarse (≤450-pt, clarity-less) shared contour
    // to a full-resolution one WITHOUT touching the notes (their boundaries are
    // time-based; the Sa is preserved so their steps stay valid). A DIFFERENT file
    // is playback-only + a warning, so it can never corrupt the curated notes.
    async function handleSharedAudioChoice(file) {
      attachAudioForPlayback(file);
      const hash = await audioFingerprint(await file.arrayBuffer());
      let isSource;
      if (sharedAudioHash && hash) isSource = (hash === sharedAudioHash);   // authoritative
      else isSource = await durationMatchesShared(file);                    // legacy token / no crypto
      if (!isSource) {
        statusMsg.textContent = 'Loaded for playback — this audio differs from the shared source, so the notes and their gamakas are unchanged.';
        return;
      }
      await upgradeContourFromSource(file, hash);
    }
    async function durationMatchesShared(file) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const b = await ctx.decodeAudioData(await file.arrayBuffer());
        return audioDuration > 0 && Math.abs(b.duration - audioDuration) <= Math.max(0.5, audioDuration * 0.02);
      } catch { return false; }
    }
    async function upgradeContourFromSource(file, hash) {
      try {
        statusMsg.textContent = 'Matched the shared source — upgrading to full-resolution contour…';
        const audioBuffer = await new (window.AudioContext || window.webkitAudioContext)().decodeAudioData(await file.arrayBuffer());
        const detector = PitchDetector.forFloat32Array(2048);
        waveEnv = buildEnvelope(audioBuffer.getChannelData(0), audioBuffer.sampleRate);
        pitchDataPoints = D.contourFromPCM(audioBuffer.getChannelData(0), audioBuffer.sampleRate, detector, { frameSize: 2048, hopSize: 512 });
        audioDuration = audioBuffer.duration;
        audioHash = hash || audioHash;
        // Re-derive the contour at full res but PRESERVE the shared Sa — the notes'
        // steps are relative to it (recompute() would re-estimate Sa and shift them).
        gatedPoints = applyRawEdits(gatePoints());
        computeRawEnds();
        { const octOnly = rawEdits.filter((e) => e.op === 'oct');
          const reapply = (pts) => octOnly.length ? applyRawEditsTo(pts, octOnly) : pts;
          octavePoints = reapply(cleanContour(gatedPoints, 0, { despike: false }));
          cleanedPoints = reapply(cleanContour(gatedPoints)); }
        computeAxis(cleanedPoints, saRefHz);
        computeCrossings(cleanedPoints);
        refreshSaInfo(); updateNoteUI(); renderFrame(player.currentTime || 0);
        idbPut({ name: file.name, blob: file, raw: pitchDataPoints, duration: audioDuration, clarityThresh, bridgeMs }).catch(() => {});
        statusMsg.textContent = `Upgraded to full-resolution contour — ${notes.length} notes kept; the clarity slider and new gamakas now use full detail.`;
      } catch (e) { console.error(e); statusMsg.textContent = 'Loaded for playback; could not upgrade the contour.'; }
    }

    // ---- Load raga data and populate the picker -----------------------------
    (async () => {
      try {
        // One database: the three files never agreed on how a raga was spelled.
        const ragas = await fetch('./core/raga-db.json').then(r => r.json());
        setRagas(ragas); setRagaExt(ragas);
        const names = Object.keys(ragas)
          .filter(n => !/^mela_\d+$/i.test(n) && n.toLowerCase() !== 'c12')
          .sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
        const sel = $('raga-sel');
        for (const n of names) {
          const o = document.createElement('option'); o.value = n; o.textContent = n; sel.appendChild(o);
        }
        sel.addEventListener('change', () => setRaga(sel.value));
      } catch (e) { console.warn('raga load failed', e); }

      // Ragas are loaded now (parse() needs them) — restore a shared session or
      // the last IDB session. Both run after the raga fetch to avoid a race.
      try { if (await loadSharedPako()) return; } catch (e) { console.warn('shared pako load failed', e); }
      try {
        const s = await idbGet();
        if (!s || !s.blob) return;
        pitchDataPoints = s.raw || [];
        audioDuration = s.duration || 0;
        if (s.clarityThresh != null) { clarityThresh = s.clarityThresh; $('claritythr').value = clarityThresh; $('claritylbl').textContent = (+clarityThresh).toFixed(2); }
        if (s.bridgeMs != null) { bridgeMs = s.bridgeMs; $('bridgems').value = bridgeMs; $('bridgelbl').textContent = bridgeMs + 'ms'; }
        objectUrl = URL.createObjectURL(s.blob);
        player.src = objectUrl;
        player.volume = audioVolVal();
        resetMarkers();
        // Before recompute(): the ops are replayed over the freshly gated
        // contour inside it, so restoring them afterwards would leave the curve
        // uncorrected until the next slider nudge.
        if (Array.isArray(s.rawEdits)) rawEdits = s.rawEdits;
        applyUiSettings(s.ui);
        recompute();
        refreshRawButtons();
        const voiced = cleanedPoints.filter(p => p.frequency !== null).length;
        statusMsg.textContent = `Restored "${s.name}" — ${voiced} voiced frames (reload-persistent).`;
        downloadBtn.disabled = pitchDataPoints.length === 0;
        openBtn.disabled = voiced < 2;
        playBtn.disabled = false; rewindBtn.disabled = false; shareBtn.disabled = false; hasAudio = true;
        playBtn.textContent = '▶ Play';

        // Rehydrate the hand-tuned model, if this session carried one, so the
        // tedious note edits come back — not just the audio. Mirrors the shared
        // -session rebuild: restore the tuned Sa + raga first so boundary steps
        // (absolute 53-EDO relative to Sa) and swara names resolve correctly.
        if (s.raga) { const opt = [...$('raga-sel').options].find((o) => o.value.toLowerCase() === s.raga.toLowerCase()); if (opt) { $('raga-sel').value = opt.value; setRaga(opt.value); } }
        if (Array.isArray(s.bnds) && s.bnds.length) {
          if (s.sa > 0) { computeAxis(cleanedPoints, s.sa); computeCrossings(cleanedPoints); refreshSaInfo(); }
          if (s.markerA != null) markerA = s.markerA;
          if (s.markerB != null) markerB = s.markerB;
          boundaries = s.bnds.map((o) => ({ t: o.t, step: o.s, name: o.s != null ? swaraNameForStep(o.s) : null, gamaka: o.g || undefined }));
          rebuildNotes();
          fitAxisToNotes();
          renderFrame(player.currentTime || 0);
          statusMsg.textContent = `Restored "${s.name}" — ${notes.length} tuned notes + ${voiced} voiced frames (reload-persistent).`;
        }
      } catch (e) { console.warn('session restore failed', e); }
    })();

    // ---- Guard against accidental navigation away (lost edits) --------------
    // A stray trackpad back-swipe or mouse back-button can navigate off the
    // page and drop unsaved note/boundary/notation edits (IDB restore only
    // carries the audio + thresholds, not the hand-tuned model). Two layers:
    //   1. beforeunload -> native prompt on reload / close / URL change.
    //   2. a pushState trap + popstate -> swallow the same-document back
    //      gesture, keep the page, and flash a warning instead of leaving.
    const hasWork = () => notes.length > 0 || notationDirty;
    window.addEventListener('beforeunload', (e) => {
      if (!hasWork()) return;
      e.preventDefault();
      e.returnValue = '';        // Chrome shows its generic unsaved-changes prompt
      return '';
    });
    history.pushState(null, '', location.href);   // trap entry to absorb one back
    window.addEventListener('popstate', () => {
      if (!hasWork()) return;    // no edits -> let the back navigation proceed
      history.pushState(null, '', location.href);   // re-arm: stay on the page
      statusMsg.textContent = 'Back navigation blocked — you have unsaved edits. Use Share or Download to save first.';
    });
  </script>
<script>
  // pitchy is reached DIRECTLY from /ragas, so without this it never triggered a
  // service-worker update check: the worker installed by a past visit to the app
  // root kept serving a cached pitchy.html indefinitely, and a deploy could sit
  // unnoticed for anyone who only opens pitchy links. update() asks explicitly
  // rather than waiting for the browser's own schedule.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then((r) => {
      // Only once one is already installed. Calling update() while the first
      // install is still running rejects with InvalidStateError -- and update()
      // REJECTS rather than throwing, so a try/catch around it catches nothing
      // and it surfaces as an unhandled page error.
      if (r.active) r.update().catch(() => {});
    }).catch(() => {});
  }
</script>
